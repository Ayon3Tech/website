/* ============================================================
   CHARTE GRAPHIQUE — MODIFIEZ CES VARIABLES POUR PERSONNALISER
   ============================================================
   3 familles de couleurs :
   - --carbon-* : fond carbone (textures fibre de carbone)
   - --metal-*  : gris métal brossé (cartes, barres, encadrés)
   - --red-*    : métal rouge (accents, CTA, liens)
   Remplacez librement les codes couleurs ci-dessous.
   ============================================================ */
:root {
  /* --- Couleurs principales --- */
  --carbon-0: #07090b;          /* fond le plus sombre */
  --carbon-1: #0c0f12;          /* fond carbone standard */
  --carbon-2: #14181d;          /* carbone clair (survol, séparations) */
  --metal-0: #262c33;           /* métal sombre */
  --metal-1: #3a4149;           /* métal brossé */
  --metal-2: #586069;           /* métal clair */
  --red-0: #6e1212;             /* métal rouge sombre */
  --red-1: #b3202a;             /* métal rouge */
  --red-2: #e04338;             /* métal rouge clair (hover) */
  /* --- Textes --- */
  --text: #e9ecef;
  --text-dim: #9aa4ad;
  --text-faint: #6b747d;
  /* --- Typographie --- */
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-heading: "Bahnschrift", "DIN Alternate", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --radius: 10px;
  --maxw: 1120px;
}

/* ============================================================
   TEXTURES — fibre de carbone, métal brossé, métal rouge
   ============================================================ */

  background-image:
    radial-gradient(circle at 25% 25%, rgba(255,255,255,.05) 1px, transparent 1.6px),
    radial-gradient(circle at 75% 75%, rgba(255,255,255,.04) 1px, transparent 1.6px),
    linear-gradient(45deg, rgba(255,255,255,.028) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.028) 75%),
    linear-gradient(-45deg, rgba(255,255,255,.028) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.028) 75%);
  background-size: 16px 16px, 16px 16px, 16px 16px, 16px 16px;

} --> */

/* Fond général : tresse de carbone */
.carbon-bg {
  background-color: rgb(32, 32, 32);
  background-image: 
    linear-gradient(to right, rgba(0,0,0,1), rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,1)), 
    linear-gradient(45deg, black 25%, transparent 25%, transparent 75%, black 75%, black), 
    linear-gradient(45deg, black 25%, transparent 25%, transparent 75%, black 75%, black), 
    linear-gradient(to bottom, rgb(8, 8, 8), rgb(32, 32, 32));
  background-size: 100% 100%, 10px 10px, 10px 10px, 10px 5px;
  background-position: 0px 0px, 0px 0px, 5px 5px, 0px 0px;
}

/* Carte en métal brossé -- ancien */
.metal-card-old {
  position: relative;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,.06) 1px 2px, transparent 2px 3px),
    linear-gradient(160deg, #4a515a 0%, #343b42 32%, #2b3138 52%, #3f454e 74%, #242a30 100%);
  background-blend-mode: overlay, normal;
  background-color: var(--metal-0);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: var(--radius);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.4), 0 12px 28px rgba(0,0,0,.45);
}

.metal-card {
  position: relative;
  isolation: isolate;
  overflow: hidden;

  /* Base métal sombre */
  background:
    /* Micro-rayures */
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      rgba(0,0,0,.035) 1.5px,
      transparent 2.5px,
      transparent 4px
    ),

    /* Rayures secondaires irrégulières */
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      rgba(255,255,255,.018) 7px,
      transparent 8px,
      transparent 15px
    ),

    /* Variation du brossage */
    linear-gradient(
      90deg,
      rgba(255,255,255,.035),
      transparent 18%,
      rgba(0,0,0,.045) 42%,
      transparent 65%,
      rgba(255,255,255,.025)
    ),

    /* Corps du métal */
    linear-gradient(
      145deg,
      #69727b 0%,
      #4d565f 13%,
      #363e46 31%,
      #252c33 49%,
      #343c44 65%,
      #555e67 82%,
      #292f36 100%
    );

  background-blend-mode:
    soft-light,
    overlay,
    soft-light,
    normal;

  border: 1px solid rgba(255,255,255,.14);
  border-radius: var(--radius);

  /* Profondeur + bords métalliques */
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 -1px 0 rgba(0,0,0,.65),
    inset 1px 0 0 rgba(255,255,255,.035),
    inset -1px 0 0 rgba(0,0,0,.22),
    0 14px 32px rgba(0,0,0,.48);

  transition:
    transform .35s cubic-bezier(.2,.8,.2,1),
    box-shadow .35s ease,
    border-color .35s ease;
}

.metal-card::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -40% -20%;

  background:
    linear-gradient(
      105deg,
      transparent 35%,
      rgba(255,255,255,.015) 42%,
      rgba(255,255,255,.10) 48%,
      rgba(255,255,255,.025) 54%,
      transparent 62%
    );

  transform: translateX(-45%) skewX(-12deg);
  opacity: .65;

  transition:
    transform .7s cubic-bezier(.2,.8,.2,1),
    opacity .35s ease;

  pointer-events: none;
}

.metal-card::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 3px,
      rgba(255,255,255,.018) 3.5px,
      transparent 4px
    );

  opacity: .55;
  mix-blend-mode: overlay;
}

.metal-card:hover {
  transform: translateY(-3px);

  border-color: rgba(255,255,255,.22);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -1px 0 rgba(0,0,0,.65),
    inset 1px 0 0 rgba(255,255,255,.05),
    inset -1px 0 0 rgba(0,0,0,.25),
    0 20px 42px rgba(0,0,0,.55);
}

.metal-card:hover::before {
  transform: translateX(45%) skewX(-12deg);
  opacity: .95;
}

.bolts::before, .bolts::after {

/* Barre / bandeau en métal rouge brossé */
.red-metal {
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px),
    linear-gradient(165deg, var(--red-2) 0%, var(--red-1) 38%, var(--red-0) 72%, #8c1d1d 100%);
  border: 1px solid rgba(255,120,100,.25);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 8px 24px rgba(179,32,42,.35);
}

/* Bande séparatrice carbone/rouge */
.stripe-red {
  height: 5px;
  background: repeating-linear-gradient(90deg, var(--red-1) 0 22px, var(--red-0) 22px 44px);
  box-shadow: 0 1px 0 rgba(255,255,255,.08) inset;
}

/* ================================ 
   CARTE PLATINUM — MÉTAL BROSSÉ -- A SUPPRIMER
================================ */ 
.platinum-card { 
  position: relative; 
  width: 420px; 
  height: 265px; 
  padding: 28px; 
  box-sizing: border-box; 
  border-radius: 20px; 
  overflow: hidden; 
  
  /* Métal platinum brossé */ 
  background: 
    repeating-linear-gradient( 0deg, rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px, rgba(0, 0, 0, 0.025) 2px, rgba(0, 0, 0, 0.025) 3px ), 
    linear-gradient( 135deg, #f8f8f8 0%, #c9cdd0 18%, #f5f6f6 38%, #aeb3b6 58%, #e9eaeb 76%, #9da3a7 100% ); 
    
  /* Profondeur */ 
  box-shadow: 0 25px 45px rgba(0, 0, 0, 0.28), inset 0 1px 1px rgba(255, 255, 255, 0.9), inset 0 -1px 2px rgba(0, 0, 0, 0.3); 
  border: 1px solid rgba(255, 255, 255, 0.65); 
  color: #181a1c; 
  font-family: Arial, sans-serif; 
  transition: transform 0.5s cubic-bezier(.2,.8,.2,1), box-shadow 0.5s ease; 
} 
  
/* Reflet métallique */ 
.platinum-card::before { 
  content: ""; 
  position: absolute; 
  inset: -100%; 
  background: 
    linear-gradient( 115deg, transparent 35%, rgba(255, 255, 255, 0.0) 42%, rgba(255, 255, 255, 0.55) 48%, rgba(255, 255, 255, 0.0) 54%, transparent 62% ); 
  transform: translateX(-35%); 
  transition: transform 0.9s ease; 
  pointer-events: none; 
} 

/* Halo subtil */ 
.platinum-card::after { 
  content: ""; 
  position: absolute; 
  inset: 0; 
  border-radius: inherit; 
  background: 
    radial-gradient( circle at 20% 10%, rgba(255,255,255,.55), transparent 28% ), 
    radial-gradient( circle at 90% 90%, rgba(255,255,255,.18), transparent 35% ); 
  pointer-events: none; 
} 

/* Animation au survol */ 
.platinum-card:hover { 
  transform: perspective(1000px) rotateX(3deg) rotateY(-5deg) translateY(-8px); 
  box-shadow: 0 35px 65px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 2px rgba(0,0,0,.25); 
} 
.platinum-card:hover::before { 
  transform: translateX(35%); 
} 

/* ================================ CONTENU ================================ */ 
.platinum-card__content { 
  position: relative; 
  z-index: 2; 
  height: 100%; 
  display: flex; 
  flex-direction: column; 
  justify-content: space-between; 
} 

/* Logo */ 
.platinum-card__logo { 
  font-size: 15px; 
  font-weight: 700; 
  letter-spacing: 5px; 
  text-transform: uppercase; 
  color: #24272a; 
  text-shadow: 0 1px 0 rgba(255,255,255,.8); 
} 

/* Puce */ 
.platinum-card__chip { 
  width: 48px; 
  height: 36px; 
  border-radius: 7px; 
  background: linear-gradient(135deg, #d9dcde, #858a8d 45%, #e7e9e9 ); 
  border: 1px solid rgba(80,80,80,.35); 
  box-shadow: inset 0 1px 2px rgba(255,255,255,.8), 0 2px 4px rgba(0,0,0,.2); 
  position: relative; 
} 

/* Gravure de la puce */ 
.platinum-card__chip::after { 
  content: ""; 
  position: absolute; 
  inset: 7px; 
  border: 1px solid rgba(40,40,40,.35); 
  border-radius: 4px; 
  background: 
    linear-gradient( 90deg, transparent 30%, rgba(50,50,50,.3) 31%, transparent 33% ); 
  } 
  
  /* Numéro */ 
  .platinum-card__number { 
    font-family: "Courier New", monospace; 
    font-size: 20px; 
    letter-spacing: 3px; 
    color: #202326; 
    text-shadow: 0 1px 0 rgba(255,255,255,.8); 
    margin-top: 8px; 
  } 
  
  /* Bas de carte */ 
  .platinum-card__bottom { 
    display: flex; 
    justify-content: space-between; 
    align-items: flex-end; 
  } 
  
  .platinum-card__holder { 
    text-transform: uppercase; 
    font-size: 11px; 
    letter-spacing: 2px; 
    color: #303336; 
  } 
  
  .platinum-card__name { 
    margin-top: 5px; 
    font-size: 14px; 
    font-weight: 600; 
    letter-spacing: 2px; 
  } 
  
  /* PLATINUM */ 
  .platinum-card__platinum { 
    font-size: 10px; 
    letter-spacing: 4px; 
    text-transform: uppercase; 
    font-weight: 700; 
    color: #383b3e; 
  }


/* ============================================================
   BASE
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  color: var(--text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { font-family: var(--font-heading); letter-spacing: .04em; text-transform: uppercase; }
section { padding: 84px 20px; }
.container { max-width: var(--maxw); margin: 0 auto; }
.sec-title { font-size: clamp(1.7rem, 3.4vw, 2.4rem); margin-bottom: 8px; }
.sec-kicker {
  display: inline-block; font-size: .78rem; letter-spacing: .22em; text-transform: uppercase;
  color: var(--red-2); margin-bottom: 10px; font-weight: 700;
}
.sec-sub { color: var(--text-dim); max-width: 720px; margin-bottom: 42px; }
a { color: var(--red-2); text-decoration: none; }
a:hover { color: #ff6f5e; }

/* Apparition au scroll */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s ease; }
.reveal.visible { opacity: 1; transform: none; }

/* ============================================================
   HEADER / NAV
   ============================================================ */
header.topbar {
  position: sticky; top: 0; z-index: 50;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, rgba(20,24,29,.97), rgba(12,15,18,.97));
  border-bottom: 1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(8px);
}
nav.bar {
  max-width: var(--maxw); margin: 0 auto; padding: 14px 20px;
  /* display: flex; align-items: center; gap: 18px; */
  display: grid; grid-template-columns: 2fr auto 1fr; align-items: center; gap: 18px;
}
.brand { justify-self: start; display: flex; align-items: center; gap: 12px; color: var(--text); font-size: 1.90rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-family: var(--font-heading); }
.brand .logo { width: 132px; height: 100px; object-fit: contain; display: block; }
.navlinks { justify-self: center; display: flex; gap: 4px; list-style: none; margin-left: auto; align-items: center; }
.navlinks a {
  color: var(--text-dim); font-size: .75rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  padding: 8px 12px; border-radius: 6px; transition: color .2s, background .2s;
}
.navlinks a:hover, .navlinks a.active { color: var(--text); background: rgba(255,255,255,.06); }
.lang-switch {
  justify-self: end; display: flex; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; overflow: hidden; margin-left: 6px;
}
.lang-switch button {
  background: transparent; color: var(--text-dim); border: 0; padding: 7px 12px;
  font-size: .78rem; font-weight: 700; letter-spacing: .1em; cursor: pointer; transition: .2s;
}
.lang-switch button.active { background: var(--red-1); color: #fff; }
.burger { display: none; background: none; border: 1px solid rgba(255,255,255,.18); border-radius: 6px; color: var(--text); font-size: 1.3rem; padding: 6px 12px; cursor: pointer; margin-left: auto; }

/* ============================================================
   HERO
   ============================================================ */
#hero { position: relative; padding-top: 110px; padding-bottom: 110px; overflow: hidden; }
#hero::before { /* halo rouge latéral */
  content: ""; position: absolute; top: -140px; right: -160px; width: 560px; height: 560px;
  background: radial-gradient(circle, rgba(224,67,56,.16), transparent 65%); pointer-events: none;
}
.hero-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 48px; align-items: center; }
.hero-name { font-size: clamp(2.3rem, 5.6vw, 3.9rem); line-height: 1.05; margin: 14px 0 12px; }
.hero-name .accent { color: transparent; background: linear-gradient(180deg, #f2a099, var(--red-1) 70%, var(--red-0)); -webkit-background-clip: text; background-clip: text; }
.hero-role { font-size: 1.06rem; color: var(--text-dim); max-width: 560px; }
.hero-tags { display: flex; flex-wrap: wrap; gap: 9px; margin: 26px 0 34px; }
.chip {
  font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
  padding: 7px 14px; border-radius: 999px;
  background: linear-gradient(180deg, var(--carbon-2), var(--carbon-1));
  border: 1px solid rgba(255,255,255,.14); color: var(--text-dim);
}
.chip.red { border-color: rgba(224,67,56,.5); color: #f4a79f; background: linear-gradient(180deg, rgba(179,32,42,.22), rgba(110,18,18,.12)); }
.btn {
  display: inline-block; padding: 14px 26px; border-radius: 8px;
  font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: .8rem;
  transition: transform .15s, filter .2s; cursor: pointer; border: 0;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.12); }
.btn-primary { background: repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px), linear-gradient(165deg, var(--red-2), var(--red-1) 45%, var(--red-0)); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 26px rgba(179,32,42,.4); }
.btn-ghost { background: linear-gradient(180deg, var(--carbon-2), var(--carbon-1)); color: var(--text); border: 1px solid rgba(255,255,255,.16); }
.hero-cta { display: flex; gap: 14px; flex-wrap: wrap; }

/* Panneau héros : plaque métal brossé */
.hero-panel { padding: 30px 28px; }
.hero-panel h3 { font-size: .82rem; letter-spacing: .2em; color: var(--red-2); margin-bottom: 18px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stat { padding: 16px 14px; background: linear-gradient(180deg, rgba(0,0,0,.28), rgba(255,255,255,.03)); border: 1px solid rgba(255,255,255,.07); border-radius: 8px; }
.stat b { display: block; font-size: 1.6rem; font-family: var(--font-heading); color: #fff; line-height: 1.1; }
.stat span { font-size: .74rem; color: var(--text-dim); letter-spacing: .06em; text-transform: uppercase; }

/* ============================================================
   SECTIONS
   ============================================================ */
.about-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: start; }
.about-text p { color: var(--text-dim); margin-bottom: 16px; }
.about-text strong { color: var(--text); }
.about-facts { list-style: none; }
.about-facts li { padding: 13px 16px; margin-bottom: 10px; border-radius: 8px; background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.2)); border-left: 3px solid var(--red-1); font-size: .92rem; color: var(--text-dim); }
.about-facts b { color: var(--text); display: block; font-size: .98rem; }

/* Services */
.services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.svc { padding: 30px 26px 26px; transition: transform .25s, box-shadow .25s; }
.svc:hover { transform: translateY(-5px); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.55); }
.svc .icon {
  width: 52px; height: 52px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px; font-size: 1.5rem;
}
.svc .icon.red { background: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px), linear-gradient(160deg, var(--red-2), var(--red-0)); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.svc .icon.steel { background: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px), linear-gradient(160deg, var(--metal-2), var(--metal-0)); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.svc h3 { font-size: 1.02rem; margin-bottom: 10px; color: #fff; }
.svc p { font-size: .9rem; color: var(--text-dim); margin-bottom: 14px; }
.svc .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.svc .tags span { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid rgba(224,67,56,.4); color: #eab4ae; background: rgba(179,32,42,.14); }

/* Compétences */
.skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
.skill-cat { padding: 24px 24px 20px; }
.skill-cat h3 { font-size: .88rem; letter-spacing: .16em; color: var(--red-2); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.skill-cat h3::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, var(--red-1), transparent); }
.skill-items { display: flex; flex-wrap: wrap; gap: 8px; }
.skill-items span {
  font-size: .8rem; padding: 6px 12px; border-radius: 6px;
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.25));
  border: 1px solid rgba(255,255,255,.1); color: var(--text);
}

/* Expérience */
.timeline { position: relative; padding-left: 34px; }
.timeline::before { content: ""; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 4px; border-radius: 4px;
  background: repeating-linear-gradient(180deg, var(--metal-1) 0 14px, var(--carbon-2) 14px 20px); }
.xp-item { position: relative; margin-bottom: 30px; }
.xp-item::before { content: ""; position: absolute; left: -33px; top: 8px; width: 16px; height: 16px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ff8b7a, var(--red-1) 55%, var(--red-0));
  box-shadow: 0 0 0 4px rgba(179,32,42,.18), 0 0 18px rgba(224,67,56,.5); }
.xp-card { padding: 22px 24px; }
.xp-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
.xp-head h3 { font-size: 1.02rem; color: #fff; }

    "Sujet : " + topic + "\n\n" + msg;
  window.location.href = "mailto:" + CONFIG.CONTACT_EMAIL +
    "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  st.className = "form-status ok";
  st.textContent = d.formOk + " " + CONFIG.CONTACT_EMAIL;
});

/* --- Stockage de la langue (protégé contre les environnements restreints) --- */
function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* --- Langues --- */
document.getElementById("btnFr").addEventListener("click", () => { LANG = "fr"; storeSet("siteLang", "fr"); render(); });
document.getElementById("btnEn").addEventListener("click", () => { LANG = "en"; storeSet("siteLang", "en"); render(); });

/* --- Menu mobile --- */
document.getElementById("burger").addEventListener("click", () => {
  document.getElementById("navLinks").classList.toggle("open");
});
document.querySelectorAll("#navLinks").forEach(ul => ul.addEventListener("click", () => ul.classList.remove("open")));

/* --- Apparition au scroll --- */
let io = null;
function observeReveals() {
  if (!("IntersectionObserver" in window)) {
    document.querySelectorAll(".reveal").forEach(el => el.classList.add("visible"));
    return;
  }
  if (!io) io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("visible"); io.unobserve(en.target); } }), { threshold: .12 });
  document.querySelectorAll(".reveal:not(.visible)").forEach(el => io.observe(el));
}

/* --- Overlay Mentions légales --- */
const legalOverlay = document.getElementById("legalOverlay");
document.getElementById("legalLink").addEventListener("click", function (e) {
  e.preventDefault();
  legalOverlay.classList.add("open");
});
document.getElementById("legalClose").addEventListener("click", function () {
  legalOverlay.classList.remove("open");
});
legalOverlay.addEventListener("click", function (e) {
  if (e.target === legalOverlay) legalOverlay.classList.remove("open");
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") legalOverlay.classList.remove("open");
});

/* --- Init --- */
const saved = storeGet("siteLang");
LANG = (saved === "en" || saved === "fr") ? saved : (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "fr";
render();
</script>
